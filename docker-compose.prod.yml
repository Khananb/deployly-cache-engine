version: '3.8'

services:
  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployly-api-prod
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_USE_SSL=${STORAGE_USE_SSL}
    depends_on:
      - db
    networks:
      - deployly-net

  # Database
  db:
    image: postgres:15-alpine
    container_name: deployly-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=deployly_cache
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - deployly-net

  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: deployly-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - deployly-net

networks:
  deployly-net:
    driver: bridge

volumes:
  postgres_prod_data:
