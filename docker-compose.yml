version: '3.8'

services:
  # Primary Database
  db:
    image: postgres:15-alpine
    container_name: deployly-db
    restart: always
    environment:
      POSTGRES_USER: deployly_admin
      POSTGRES_PASSWORD: password_change_me
      POSTGRES_DB: deployly_cache
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d # Mount schema.sql here
      - postgres_data:/var/lib/postgresql/data

  # Object Storage (S3 Compatible)
  minio:
    image: minio/minio
    container_name: deployly-storage
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Create initial bucket automatically
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minio_admin minio_password) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/deployly-caches;
      /usr/bin/mc anonymous set download local/deployly-caches;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
